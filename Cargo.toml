[package]
name = "aloecrypt"
version = "0.1.2"
edition = "2024"

[lib]
name = "aloecrypt"
src = "src/lib.rs"

[dependencies]
curve25519-dalek = "4.1"
sha2 = "0.10"
thiserror = "1.0"
rand_core = "0.10"
chacha20poly1305 = "0.10"
pbkdf2 = "0.12"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0"
rmp-serde = "1.3.1"
serde-generate = "0.33.0"
serde-reflection = "0.5.2"
serde-big-array = "0.5.1"
regex = "1.12.3"
lz4_flex = "0.12.0"
sha3 = {version = "0.11.0-rc.7", default-features = false}
ml-kem = {version="0.3.0-rc.0"}
ml-dsa = { version="0.1.0-rc.8", features = ["rand_core"]}
rand_chacha = "0.10.0"
zerocopy = "0.8.40"
hybrid-array = "0.4.7"
hkdf = "0.12.4"
hex-literal = "1.1.0"
futures = "0.3"
getrandom = {version = "0.2"}

# Not Browser
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
uuid = {version = "1.20.0",features = ["v4", "v7", "fast-rng"]}

# Browser only
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
web-time = "1.1"
instant = { version = "0.1", features = ["wasm-bindgen"] }
uuid = {version = "1.20.0",features = ["v4", "v7", "fast-rng", "js"]}
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
wasm-bindgen-test = "0.3.12"
tokio-test = "0.4"
stacker = "0.1"


[build-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }